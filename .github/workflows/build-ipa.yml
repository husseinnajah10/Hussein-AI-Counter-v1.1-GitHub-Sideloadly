name: Build Hussein AI Counter IPA (unsigned)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build-unsigned-ipa:
    runs-on: macos-15
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Validate project and assets
        shell: bash
        run: |
          set -euo pipefail
          plutil -lint HusseinAICounter/Info.plist
          python3 tests/validate_release.py
          xcrun swiftc -frontend -parse HusseinAICounter/*.swift
          xcodebuild -list -project HusseinAICounter.xcodeproj

      - name: Build iPhone app without signing
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project HusseinAICounter.xcodeproj \
            -scheme HusseinAICounter \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build 2>&1 | tee "$RUNNER_TEMP/hn-build.log" || {
              echo '===== Build errors ====='
              grep -n -E 'error:|BUILD FAILED|SwiftCompile' "$RUNNER_TEMP/hn-build.log" | tail -80 || true
              exit 1
            }

      - name: Verify built app metadata
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/HusseinAICounter.app"
          test -d "$APP"
          test -s "$APP/HusseinAICounter"
          plutil -lint "$APP/Info.plist"
          BUNDLE_ID=$(plutil -extract CFBundleIdentifier raw -o - "$APP/Info.plist")
          echo "Bundle identifier: $BUNDLE_ID"
          test "$BUNDLE_ID" = 'com.husseinnajah.HusseinAICounter'
          VERSION=$(plutil -extract CFBundleShortVersionString raw -o - "$APP/Info.plist")
          echo "App version: $VERSION"
          test "$VERSION" = '2.0'

      - name: Package app into unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/HusseinAICounter.app"
          mkdir -p "$RUNNER_TEMP/IPA/Payload"
          cp -R "$APP" "$RUNNER_TEMP/IPA/Payload/"
          cd "$RUNNER_TEMP/IPA"
          zip -qry "$GITHUB_WORKSPACE/HusseinAICounter-unsigned.ipa" Payload
          test -s "$GITHUB_WORKSPACE/HusseinAICounter-unsigned.ipa"

      - name: Upload IPA for Windows sideloading
        uses: actions/upload-artifact@v4
        with:
          name: HusseinAICounter-v2.0-unsigned-IPA
          path: HusseinAICounter-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
